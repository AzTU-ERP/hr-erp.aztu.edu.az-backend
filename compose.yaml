services:
  postgres:
    image: 'postgres:16-alpine'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_USER=myuser'
      - 'POSTGRES_PASSWORD=secret'
    ports:
      - '5432:5432'
    volumes:
      - 'pgdata:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U myuser -d mydatabase']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: 'rabbitmq:3-management-alpine'
    environment:
      - 'RABBITMQ_DEFAULT_USER=myuser'
      - 'RABBITMQ_DEFAULT_PASS=secret'
    ports:
      - '5672:5672'    # AMQP
      - '15672:15672'  # management UI (http://localhost:15672)
    volumes:
      - 'rabbitmq-data:/var/lib/rabbitmq'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy   # Flyway migrates at startup, needs the DB ready
      rabbitmq:
        condition: service_healthy
    environment:
      # Point the app at the compose service names instead of localhost.
      - 'DB_URL=jdbc:postgresql://postgres:5432/mydatabase'
      - 'DB_USERNAME=myuser'
      - 'DB_PASSWORD=secret'
      - 'SPRING_RABBITMQ_HOST=rabbitmq'
      - 'SPRING_RABBITMQ_PORT=5672'
      - 'SPRING_RABBITMQ_USERNAME=myuser'
      - 'SPRING_RABBITMQ_PASSWORD=secret'
      - 'STORAGE_BASE_PATH=/app/hr-storage'
    ports:
      - '8080:8080'
    volumes:
      - 'hr-storage:/app/hr-storage'

volumes:
  pgdata:
  rabbitmq-data:
  hr-storage:
