# Production profile overrides. Secrets come from the environment, never this file.
# Activate with: --spring.profiles.active=prod

# ---- SSO ----
# Hard-disable the unsigned dev token decoder. This is a literal, not a placeholder, so no
# SSO_DEV_MODE value can switch it back on; SsoClient additionally refuses dev mode whenever the
# prod profile is active, so the guarantee does not rest on property precedence alone.
app.sso.dev-mode=false

# JWKS verification is mandatory in production — no introspection fallback, no dev decoder.
app.sso.jwks-uri=${SSO_JWKS_URI:https://auth.aztu.edu.az/.well-known/jwks.json}
app.sso.issuer=${SSO_ISSUER:https://auth.aztu.edu.az}

# ---- Datasource ----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ---- Mail ----
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
