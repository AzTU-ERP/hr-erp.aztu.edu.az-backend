spring.application.name=hr-erp

# ---- Server ----
# auth-erp occupies 8080 (and 8081 in its local profile), so HR takes 8082 to let both run together.
server.port=${SERVER_PORT:8082}

# ---- Datasource (PostgreSQL) ----
# Defaults target a local Postgres; override via env for the VPS deployment.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mydatabase}
spring.datasource.username=${DB_USERNAME:myuser}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# Let Flyway own the schema; Hibernate only validates against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- Flyway ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Docker-compose support is disabled so the explicit datasource above is used.
spring.docker.compose.enabled=false

# ---- Mail ----
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
app.mail.from=${MAIL_FROM:hr@aztu.edu.az}

# ---- File storage (VPS filesystem) ----
app.storage.base-path=${STORAGE_BASE_PATH:./hr-storage}
app.storage.max-size-bytes=${STORAGE_MAX_SIZE:10485760}

# ---- Internationalization ----
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# ---- CORS allowed origins (ERP admin + karyera public) ----
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,https://erp.aztu.edu.az,https://karyera.aztu.edu.az}

# ---- SSO (central auth microservice) ----
# Access tokens are RS256 JWTs minted by auth-erp and verified locally against its JWKS, so there is
# no per-request call to auth. Point jwks-uri/issuer at a local auth-erp for development, e.g.
#   SSO_JWKS_URI=http://localhost:8081/.well-known/jwks.json  SSO_ISSUER=https://auth.aztu.edu.az
# (the issuer is a fixed identifier in the token, not a URL that gets fetched — leave it as-is).
#
# Trade-off: local verification means a session revoked in auth keeps working here until the token
# expires — auth's access-token TTL is 15 minutes. Immediate revocation needs a signal from auth
# (see A9 in AUTH_HR_INTEGRATION.md); it is not implemented.
app.sso.jwks-uri=${SSO_JWKS_URI:https://auth.aztu.edu.az/.well-known/jwks.json}
app.sso.issuer=${SSO_ISSUER:https://auth.aztu.edu.az}
# Legacy fallback, only consulted when jwks-uri is empty. auth-erp exposes no introspection endpoint.
app.sso.introspection-url=${SSO_INTROSPECTION_URL:}
# Unsigned "userId:role1,role2" tokens. Off by default and force-disabled under the prod profile.
app.sso.dev-mode=${SSO_DEV_MODE:false}

# ---- Cross-module integration targets (outbox worker delivers here) ----
app.integration.finance.base-url=${FINANCE_BASE_URL:http://localhost:9101}
app.integration.turnstile.base-url=${TURNSTILE_BASE_URL:http://localhost:9102}
app.integration.max-attempts=${INTEGRATION_MAX_ATTEMPTS:5}

# ---- Jackson (Jackson 3 / tools.jackson under Spring Boot 4) ----
spring.jackson.default-property-inclusion=non_null
